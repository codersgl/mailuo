<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="脉络">
  <!--
    脉络 / Mailuo 的「有底版」版本：品牌靛圆角方块 + 白色单色 M。

    只用在无法使用透明底或背景不可控的地方：
    - favicon.ico（老浏览器与 Windows 的 ICO 回退，透明底单色 M 在深色标签栏上对比度只有 2.9:1）
    - apple-touch-icon（iOS 会把透明像素填黑，必须给不透明底）
    界面顶栏与应用图标本身都用透明版（icon.svg / icon-mono.svg），不用这个。

    M 用 <g transform> 缩到方块的约 60% 并居中，不另画一套坐标：
    以后改 M 的几何只改 icon-mono.svg 里那四条路径，这里是引用关系。
    方块圆角 116（512 的 22.7%），与 macOS/Windows 的圆角习惯接近。
  -->
  <rect width="512" height="512" rx="116" fill="#4a5ad9"/>
  <g transform="translate(40 40) scale(0.85)">
    <path d="M74 112 L74 400 L178 400 L178 219 Z" fill="#ffffff"/>
    <path d="M74 112 L178 112 L256 224 L256 300 Z" fill="#ffffff"/>
    <path d="M438 112 L334 112 L256 224 L256 300 Z" fill="#ffffff"/>
    <path d="M438 112 L438 400 L334 400 L334 219 Z" fill="#ffffff"/>
  </g>
</svg>
