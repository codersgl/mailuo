<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="脉络">
  <!--
    脉络 / Mailuo 应用图标母版（彩色，透明底）。

    造型是「四个折面拼出的 M」：左右各一条竖腿 + 两条斜带，两条斜带在 x=256 处
    合拢成 M 中间的那道折痕。折痕落在字母自己的对角线上，所以放大看有明确的
    受光面与背光面；左右两组用色相区分（左靛 = 父任务，右青 = 子任务），
    这层含义只在 48px 以上才读得出来，小尺寸请用 icon-mono.svg。

    几何就是这四个梯形，没有渐变、没有描边、没有滤镜：
    纯色填充才能在 16px 与深色任务栏上都不糊，也才能被任何光栅化工具稳定渲染。

    改这里之后要跑 `node scripts/build-icons.mjs` 重新生成 apps/web/public/ 下的产物，
    该脚本用无头 Chrome 光栅化（ImageMagick 的内置渲染器对 mask/渐变不准，见
    docs/decisions.md D57）。
  -->
  <!-- 左腿：外侧受光面 -->
  <path d="M76 116 L76 400 L172 400 L172 214 Z" fill="#4a5ad9"/>
  <!-- 左斜带：父到子的过渡面 -->
  <path d="M76 116 L172 116 L256 236 L256 300 Z" fill="#6f7dff"/>
  <!-- 右斜带：与左斜带同一个折痕，换成子任务的青色 -->
  <path d="M436 116 L340 116 L256 236 L256 300 Z" fill="#18aecb"/>
  <!-- 右腿：外侧背光面 -->
  <path d="M436 116 L436 400 L340 400 L340 214 Z" fill="#0e7f96"/>
</svg>
